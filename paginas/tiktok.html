<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conectar TikTok | Juegos Rock</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.ico">
<style>body{margin:0;background:#f1c232;color:#141210;font:16px/1.6 Arial,Helvetica,sans-serif}main{max-width:720px;margin:0 auto;padding:32px 18px}h1{font-size:2rem;margin:0 0 16px}h2{font-size:1.15rem;margin:24px 0 6px}a{color:#d7262e}.caja{background:#fff6dc;border:3px solid #141210;box-shadow:6px 6px 0 #141210;padding:18px}code{display:block;word-break:break-all;background:#141210;color:#f1c232;padding:12px;font-size:1rem;margin:10px 0}button{font:700 1rem Arial;padding:10px 18px;background:#d7262e;color:#fff6dc;border:3px solid #141210;cursor:pointer}</style></head>
<body><main><div class="caja"><h1>Conectar TikTok</h1>
<div id="ok" hidden><p>Listo. Copiá este código y pegalo en GitHub, en la tarea <b>Conectar TikTok</b> (vale unos minutos):</p><code id="cod"></code><button type="button" id="cp">Copiar código</button></div>
<p id="no">Esta página es para conectar la cuenta de TikTok de Juegos Rock. Si llegaste acá por error, <a href="/">volvé al inicio</a>.</p>
<script>const q=new URLSearchParams(location.search),c=q.get("code");if(c){document.getElementById("ok").hidden=false;document.getElementById("no").hidden=true;document.getElementById("cod").textContent=c;document.getElementById("cp").onclick=()=>{navigator.clipboard.writeText(c);document.getElementById("cp").textContent="¡Copiado!"}}else if(q.get("error")){document.getElementById("no").textContent="TikTok devolvió un error: "+(q.get("error_description")||q.get("error"))}</script></div><p><a href="/">← Volver a Juegos Rock</a></p></main></body></html>
