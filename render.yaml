services:
  - type: web
    name: adivina-la-tapa
    runtime: static
    buildCommand: node build.js
    staticPublishPath: public
    envVars:
      - key: SUPA_URL
        sync: false
      - key: SUPA_KEY
        sync: false
      - key: GOOGLE_ID
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      # Seguridad: nadie puede mostrar la página adentro de otra (para engañar a la gente), el navegador no adivina
      # tipos de archivo, no se mandan direcciones completas a otros sitios, sin cámara/micrófono/ubicación,
      # y solo se carga código y datos de la página y de los servicios que usa
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://itunes.apple.com https://*.apple.com https://gc.zgo.at https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co https://*.goatcounter.com https://itunes.apple.com https://es.wikipedia.org https://www.wikidata.org https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
