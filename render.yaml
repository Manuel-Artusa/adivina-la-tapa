services:
  - type: web
    name: adivina-la-tapa
    runtime: static
    buildCommand: node build.js
    staticPublishPath: public
    envVars:
      - key: SUPA_URL
        sync: false
      - key: SUPA_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
