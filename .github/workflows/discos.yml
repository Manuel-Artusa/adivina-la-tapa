name: Armar discos.json

on:
  workflow_dispatch:
    inputs:
      todo:
        description: "Volver a buscar TODOS los discos (tarda ~1 hora). Si no, solo los nuevos."
        type: boolean
        default: false
  schedule:
    - cron: "0 7 1 * *"   # el día 1 de cada mes, para refrescar tapas y audios
  push:
    branches: [main]
    paths: ["armar_discos.py", "armar_temas.py", "index.html", "discos_manual.json"]   # si cambia el catálogo, el script o un link a mano, busca lo nuevo

permissions:
  contents: write

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Buscar discos en iTunes
        run: python armar_discos.py ${{ (github.event_name == 'schedule' || inputs.todo) && '--todo' || '' }}
      - name: Guardar los temas de cada banda (Ahorcado)
        run: python armar_temas.py
      - name: Guardar discos.json en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discos.json
          [ -d logos ] && git add logos
          [ -d temas ] && git add temas
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar discos.json"
          # Mientras buscaba (tarda un rato) pueden haber subido otros cambios: los trae y reintenta
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
