name: Armar discos.json

on:
  workflow_dispatch:
    inputs:
      todo:
        description: "Volver a buscar TODOS los discos (con más de 2000 discos puede pasar el límite de 3 horas). Si no, solo los nuevos, de a tandas."
        type: boolean
        default: false
      reintentar:
        description: "Volver a probar los que no se encontraron y los que quedaron sin lista de temas"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 1 * *"   # el día 1 de cada mes: busca lo que falte y refresca los temas del Ahorcado
  push:
    branches: [main]
    paths: ["armar_discos.py", "armar_temas.py", "index.html", "discos_manual.json"]   # si cambia el catálogo, el script o un link a mano, busca lo nuevo

permissions:
  contents: write
  actions: write   # para volver a correrse sola si quedan discos por buscar

concurrency: discos

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Buscar discos en iTunes
        run: python armar_discos.py ${{ inputs.todo && '--todo' || ((github.event_name == 'schedule' || inputs.reintentar) && '--max=250' || '--max=400') }} ${{ (github.event_name == 'schedule' || inputs.reintentar) && '--reintentar' || '' }}   # de a 400 por tanda; los no encontrados se reprueban solo en la corrida mensual
      - name: Guardar discos.json en el repo (apenas termina de buscar, así no se pierde si después se corta)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discos.json
          [ -d logos ] && git add logos
          [ -d temas ] && git add temas
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar discos.json"
          # Mientras buscaba (tarda un rato) pueden haber subido otros cambios: los trae y reintenta
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
      - name: Guardar los temas de cada banda (Ahorcado)
        if: ${{ hashFiles('quedan.txt') == '' }}   # recién en la última tanda
        continue-on-error: true
        timeout-minutes: 40
        run: python armar_temas.py
      - name: Guardar los temas en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discos.json
          [ -d logos ] && git add logos
          [ -d temas ] && git add temas
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar temas"
          # Mientras buscaba (tarda un rato) pueden haber subido otros cambios: los trae y reintenta
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
      - name: Si quedan discos por buscar, otra tanda
        if: ${{ hashFiles('quedan.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Quedan $(cat quedan.txt) discos: arranco otra tanda"
          gh workflow run discos.yml --ref main ${{ (github.event_name == 'schedule' || inputs.reintentar) && '-f reintentar=true' || '' }}   # la tanda siguiente sigue reintentando
