name: Publicar en redes

on:
  schedule:
    # GitHub atrasa mucho las tareas programadas a la hora en punto: por eso minutos "raros"
    # y un segundo intento por turno (si el primero ya publicó, el segundo no repite nada)
    - cron: "7 11 * * *"    # 8:07 de Argentina: post del día + historias del desafío
    - cron: "37 13 * * *"   # 10:37: segundo intento de la mañana
    - cron: "7 21 * * *"    # 18:07: cumpleaños, efemérides y video
    - cron: "37 23 * * *"   # 20:37: segundo intento de la tarde
  workflow_dispatch:
    inputs:
      turno:
        description: "Qué publicar (promo = video que muestra la página, solo para descargar)"
        type: choice
        options: [manana, tarde, todo, aniversario, promo]
        default: manana
      prueba:
        description: "Modo prueba: solo arma las imágenes para revisar, no publica"
        type: boolean
        default: true
      dia:
        description: "Día (AAAA-MM-DD). Vacío = hoy"
        required: false
      disco:
        description: "Para \"aniversario\": el disco, como Banda|Disco (ej. Los Piojos|Verde Paisaje del Infierno)"
        required: false

concurrency: redes

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Las publicaciones automáticas arrancan cuando cargues el secreto IG_TOKEN (ver INSTAGRAM.md)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.REDES_ACTIVO == 'si' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Instalar Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 ffmpeg-static@5.2.0
          npx playwright install --with-deps chromium
      - name: Armar el sitio
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
          SITE_URL: https://juegosrock.com.ar
        run: node build.js
      - name: Video promocional de la página
        if: ${{ inputs.turno == 'promo' }}
        run: node redes/promo.mjs
      - name: Armar y publicar
        if: ${{ inputs.turno != 'promo' }}
        env:
          TURNO: ${{ github.event_name == 'schedule' && ((github.event.schedule == '7 11 * * *' || github.event.schedule == '37 13 * * *') && 'manana' || 'tarde') || inputs.turno }}
          PRUEBA: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && 'true' || 'false' }}
          DIA: ${{ inputs.dia }}
          DISCO: ${{ inputs.disco }}
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: node redes/publicar.mjs
      - name: Guardar las imágenes para revisar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redes-${{ github.run_id }}
          path: redes/salida/
          retention-days: 7
