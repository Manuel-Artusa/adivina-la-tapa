name: Revisar discos faltantes
on:
  push:
    branches: [claude/eloquent-volta-fhgobi]
    paths: ["revisar_faltantes.py", ".github/workflows/revisar-faltantes.yml"]
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python revisar_faltantes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-faltantes
          path: revision_faltantes.json
